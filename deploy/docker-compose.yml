# Start with:  ADMIN_USERNAME=admin ADMIN_PASSWORD=change-me docker compose -f deploy/docker-compose.yml up -d
# ADMIN_* are only needed on first start (when no administrator exists yet).
# The server speaks plain HTTP; put a reverse proxy (e.g. Caddy) in front for HTTPS.
services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    restart: unless-stopped
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MOKOUP2P_LISTEN: ":8080"
      MOKOUP2P_DB: /data/mokoup2p.db
      # Relay node addresses handed to devices, comma-separated.
      MOKOUP2P_RELAY_PEERS: ${MOKOUP2P_RELAY_PEERS:-}
    ports:
      - "${MOKOUP2P_PORT:-8080}:8080"
    volumes:
      - server-data:/data

volumes:
  server-data:
